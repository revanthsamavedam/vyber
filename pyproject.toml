[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-muse"
version = "0.1.0"
description = "Super Muse — a multi-agent personal work agent: a planner orchestrates specialist subagents (research, build, data, writing), a reviewer gates their work, with skills, 3-tier memory, approvals, and a full trace. Built on Pydantic AI; model is one env var."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-ai>=0.0.49",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["core*", "studio*"]
